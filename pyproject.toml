[project]
name = "nyc-rideshare-congestion"
version = "0.1.0"
description = "A tested pipeline for NYC Lyft and Uber trip data, and a study of what congestion pricing changed."
readme = "README.md"
license = "MIT"
authors = [{ name = "Iliya Valizadeh" }]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pyarrow>=26.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "textstat>=0.7.4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nyc_rideshare_congestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=nyc_rideshare_congestion --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py311"
# tools/ is copied from ds-project-standard and checked there. `copier update` replaces it.
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
