# The same checks as CI, run on each commit. Install once with: uv run pre-commit install
# Every hook uses the tools already in the uv environment, so nothing else is downloaded.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
        exclude: ^tools/
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
        exclude: ^tools/
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: check-docs
        name: docs checks
        entry: make check-docs
        language: system
        files: \.md$
        pass_filenames: false
